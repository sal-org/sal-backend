<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        </head>
        <body>
            <h3 style="color: rgb(113, 113, 233);">App Feedback Details</h3>
            <table style="width: 50%;text-align: left;">
                <tr>
                    <th style="color:#808080; padding: 10px;">Client Name:</th>
                    <td>{{.ClientFirstName}}</td><td style="text-align: left;">{{.ClientLastName}}</td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Email ID:</th>
                    <td>{{.ClientEmail}}</td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Concerns Type:</th>
                    <td>{{.ConcernsType}}</td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Concern Area:</th>
                    <td>{{.ConcernArea}}</td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Details:</th>
                    <td>{{.Details}}</td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Attach1:</th>
                    <td><img src="{{.MediaURL}}{{.Attach1}}"></td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Attach2:</th>
                    <td><img src="{{.MediaURL}}{{.Attach2}}"></td>
                </tr>
                <tr>
                    <th style="color:#808080; padding: 10px;">Attach3:</th>
                    <td><img src="{{.MediaURL}}{{.Attach3}}"></td>
            </table>
        </body>
    </html>
