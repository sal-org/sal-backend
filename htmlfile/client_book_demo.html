<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  </head>
  <body>
    <h3 style="color: rgb(113, 113, 233)">Client Book Demo Details</h3>
    <table style="width: 50%; text-align: left">
      <tr>
        <th style="color: #808080; padding: 10px">Name:</th>
        <td>{{.Name}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Phone:</th>
        <td>{{.Phone}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Email:</th>
        <td>{{.Email}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Company Name:</th>
        <td>{{.CompanyName}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Company Location:</th>
        <td>{{.CompanyLocation}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Company Size:</th>
        <td>{{.CompanySize}}</td>
      </tr>
      <tr>
        <th style="color: #808080; padding: 10px">Message:</th>
        <td>{{.Message}}</td>
      </tr>

</html>
